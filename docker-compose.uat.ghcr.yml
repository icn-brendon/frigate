#
# Frigate UAT compose — pull-only variant.
#
# Pulls a prebuilt image from GHCR (pushed by .github/workflows/uat-image.yml).
# Use this on the NVR host when you do NOT want to clone the source and build.
#
# Usage:
#   export FRIGATE_UAT_TAG=<short-sha-or-tag>   # e.g. 843c10b6
#   docker compose -f docker-compose.uat.ghcr.yml pull
#   docker compose -f docker-compose.uat.ghcr.yml up -d
#
services:
  frigate:
    container_name: frigate-uat
    image: ghcr.io/icn-brendon/frigate:${FRIGATE_UAT_TAG:-feature-dual-stream-recording}
    pull_policy: always
    restart: unless-stopped
    shm_size: "256mb"
    # Uncomment for hardware passthrough on the NVR host:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    #   - /dev/apex_0:/dev/apex_0
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./media/frigate:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    env_file:
      - ./.env.uat
