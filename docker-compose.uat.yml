#
# Frigate UAT compose file for the dual-stream-recording fork.
#
# Builds a local image from docker/main/Dockerfile (target: frigate) and
# tags it as frigate-uat:dual-stream so it can be redeployed on the NVR host.
#
# Usage:
#   docker compose -f docker-compose.uat.yml build
#   docker compose -f docker-compose.uat.yml up -d
#
services:
  frigate:
    container_name: frigate-uat
    image: frigate-uat:dual-stream
    build:
      context: .
      dockerfile: docker/main/Dockerfile
      target: frigate
    restart: unless-stopped
    # NOTE: privileged mode is usually NOT required. Only enable if you
    # need broad host device access (e.g. some USB Coral / hwaccel setups)
    # and a more targeted `devices:` entry is not sufficient.
    # privileged: true
    shm_size: "256mb"
    # Uncomment and adjust for hardware passthrough on the NVR host:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb   # Google Coral USB
    #   - /dev/apex_0:/dev/apex_0     # Google Coral M.2/PCIe
    #   - /dev/dri/renderD128:/dev/dri/renderD128  # Intel iGPU (VAAPI/QSV)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./media/frigate:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"        # Internal unauthenticated UI/API (expose carefully)
      - "8971:8971"        # Authenticated UI/API
      - "1935:1935"        # RTMP (legacy restream)
      - "8554:8554"        # RTSP restream (go2rtc)
      - "8555:8555/tcp"    # WebRTC over TCP
      - "8555:8555/udp"    # WebRTC over UDP
    env_file:
      - ./.env.uat
