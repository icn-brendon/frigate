#
# Frigate UAT compose — pull-only variant.
#
# Pulls a prebuilt image from GHCR (pushed by .github/workflows/uat-image.yml).
# Use this on the NVR host when you do NOT want to clone the source and build.
#
# Usage:
#   export FRIGATE_UAT_TAG=<short-sha-or-tag>   # e.g. 843c10b6
#   docker compose -f docker-compose.uat.ghcr.yml pull
#   docker compose -f docker-compose.uat.ghcr.yml up -d
#
services:
  frigate:
    container_name: frigate-uat
    image: ghcr.io/icn-brendon/frigate:${FRIGATE_UAT_TAG:-feature-dual-stream-recording}
    pull_policy: always
    restart: unless-stopped
    shm_size: "256mb"
    # Uncomment for hardware passthrough on the NVR host:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    #   - /dev/apex_0:/dev/apex_0
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./media/frigate:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          # Substream record cache only. The mainstream event-recording
          # ring buffer is now on a dedicated tmpfs at /tmp/event_cache
          # (M1) so a runaway high-bitrate mainstream cannot evict
          # substream segments by filling this mount. Keep this block
          # aligned with docker-compose.uat.yml.
          size: 1000000000
      - type: tmpfs
        target: /tmp/event_cache
        tmpfs:
          # Per-camera mainstream event_recording ring buffer
          # (subdir per camera). Holds ~pre_capture seconds of mainstream
          # (default 15s) at ~2s segment cadence. For an 8 Mbps mainstream:
          #     8 Mbps * 15 s / 8 = 15 MB per camera (steady state).
          # Active events transiently spike higher (segments wait briefly
          # before being moved to /media/frigate). 512 MB accommodates
          # ~6 cameras with comfortable headroom; bump if you run many
          # high-bitrate mainstream cameras. Keep this block aligned with
          # docker-compose.uat.yml.
          size: 536870912
    ports:
      - "5000:5000"
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    env_file:
      - ./.env.uat
