name: UAT image build

on:
  push:
    branches:
      - feature/dual-stream-recording
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push UAT image to GHCR
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Branch slug
        id: slug
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Generate version file
        run: make version

      - name: Build and push amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/main/Dockerfile
          target: frigate
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.slug.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-rocm:
    name: Build and push ROCm UAT image to GHCR
    runs-on: ubuntu-22.04
    needs: []
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Branch slug
        id: slug
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Generate version file
        run: make version

      - name: Build and push ROCm image
        env:
          HSA_OVERRIDE: "0"
        uses: docker/bake-action@v7
        with:
          source: .
          push: true
          targets: rocm
          files: docker/rocm/rocm.hcl
          set: |
            rocm.tags=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.sha.outputs.short }}-rocm
            rocm.tags=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.slug.outputs.value }}-rocm
            *.cache-from=type=gha,scope=rocm
            *.cache-to=type=gha,scope=rocm,mode=max
